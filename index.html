<!DOCTYPE html>
<html>
<head>
  <title>Twila</title>
</head>
<body>

<h1>Twila 🌿✨</h1>

<input id="userInput" placeholder="Talk to me..." />
<button onclick="reply()">Send</button>

<p id="response"></p>

<script>
function reply() {
  let input = document.getElementById("userInput").value.toLowerCase();
  let response = "";

  if (input.includes("Hello") || input.includes("hi") || input.includes("hey")) {
    response = "Hey 🌿✨ I'm here. How are you feeling today?";
  } 
  else if (input.includes("how are you")) {
    response = "I'm here with you 💜 How about you?";
  }
  else if (input.includes("sad") || input.includes("bad") || input.includes("cry")) {
    response = "I'm really sorry you're feeling this way. Do you want to talk about it?";
  } 
  else if (input.includes("happy") || input.includes("good") || input.includes("excited")) {
    response = "That’s really nice to hear 🌿✨ What made you feel this way?";
  } 
  else if (input.includes("stress") || input.includes("tired")) {
    response = "That sounds exhausting… want to tell me what’s been going on?";
  } 
  else {
    response = "I'm listening 🌿 Tell me more.";
  }

  document.getElementById("response").innerText = response;
}
</script>

</body>
</html>
