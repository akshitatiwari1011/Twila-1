<!DOCTYPE html>
<html>
<head>
  <title>Twila</title>
</head>
<body>

<h1>Twila 🌿✨</h1>

<input id="userInput" placeholder="Talk to me..." />
<button onclick="reply()">Send</button>

<p id="response"></p>

<script>
function reply() {
  let input = document.getElementById("userInput").value;

  let responses = [
    "I hear you. Tell me more.",
    "That sounds important. What happened next?",
    "I'm here with you.",
    "Why do you feel this way?"
  ];

  let random = responses[Math.floor(Math.random() * responses.length)];

  document.getElementById("response").innerText = random;
}
</script>

</body>
</html>
